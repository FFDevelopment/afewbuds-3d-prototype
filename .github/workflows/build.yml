name: Build desktop baseline
on:
  push:
    branches: [main, feature/property-phone-hub-v1, feature/friend-characters-20261010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Identify packaged version
        id: release
        run: |
          python -c 'import re; from pathlib import Path; print("version=" + re.search(r"config/version=\"([^\"]+)", Path("game/project.godot").read_text()).group(1))' >> "$GITHUB_OUTPUT"
      - name: Install Godot 4.7.2 and desktop export templates
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo /tmp/godot >> "$GITHUB_PATH"
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -j -q /tmp/templates.tpz 'templates/windows_release_x86_64.exe' 'templates/windows_release_x86_64_console.exe' 'templates/linux_release.x86_64' 'templates/version.txt' -d ~/.local/share/godot/export_templates/4.7.2.stable
      - name: Recover and retain pinned AFewBuds assets on first build
        run: |
          set -euo pipefail
          if [ ! -f game/assets/.recovered-source ]; then
            python tools/recover_assets.py /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          fi
      - name: Import editable assets
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path game --editor --import --quit
      - name: Test movement, interactions, and isolated saves
        run: python tools/test.py /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Export desktop builds
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux
          Godot_v4.7.2-stable_linux.x86_64 --headless --path game --export-release 'Windows Desktop' 2>&1 | tee build/windows-export.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path game --export-release 'Linux' 2>&1 | tee build/linux-export.log
          if grep -E 'SCRIPT ERROR|^ERROR:' build/*-export.log; then exit 1; fi
          chmod +x build/linux/AFewBuds-3D-Prototype.x86_64
          build/linux/AFewBuds-3D-Prototype.x86_64 --headless --quit-after 120 2>&1 | tee build/runtime.log
          if grep -E 'SCRIPT ERROR|^ERROR:' build/runtime.log; then exit 1; fi
          XDG_DATA_HOME="$(mktemp -d)" timeout 60s build/linux/AFewBuds-3D-Prototype.x86_64 --headless -- --export-smoke 2>&1 | tee build/exported-world.log
          if grep -E 'SCRIPT ERROR|^ERROR:' build/exported-world.log; then exit 1; fi
          grep -q 'EXPORTED_WORLD_RESULT: PASS' build/exported-world.log
          printf 'AFewBuds Desktop %s\nSource: %s\n' '${{ steps.release.outputs.version }}' '${{ github.sha }}' > build/windows/BUILD_VERSION.txt
          cp build/windows/BUILD_VERSION.txt build/linux/BUILD_VERSION.txt
          cp README.md build/windows/README.md
          cp README.md build/linux/README.md
          python tools/package_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: AFewBuds-Desktop-${{ steps.release.outputs.version }}-Windows
          path: build/windows/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: AFewBuds-Desktop-${{ steps.release.outputs.version }}-Linux
          path: build/linux/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: AFewBuds-Desktop-${{ steps.release.outputs.version }}-Source
          path: build/AFewBuds-3D-Prototype-Source.zip
          if-no-files-found: error
          retention-days: 30
