name: Validate desktop furniture and production crew
on:
  push:
    branches: [fix/furniture-placement]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Restore pinned character and game assets
        run: |
          set -euo pipefail
          if [ ! -f game/assets/.recovered-source ]; then
            python3 tools/recover_assets.py /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          fi
      - name: Import assets and verify scripts parse
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --editor --import --quit 2>&1 | tee /tmp/afb-import.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/afb-import.log; then exit 1; fi
      - name: Verify all desktop gameplay, UI, inventory, furniture and animation tests
        run: python3 tools/test.py /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
