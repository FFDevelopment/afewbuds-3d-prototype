name: Validate desktop furniture and production crew
on:
  push:
    branches: [fix/furniture-placement]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Restore pinned character and game assets
        run: |
          set -euo pipefail
          if [ ! -f game/assets/.recovered-source ]; then
            python3 tools/recover_assets.py /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          fi
      - name: Import assets and verify scripts parse
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --editor --import --quit 2>&1 | tee /tmp/afb-import.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/afb-import.log; then exit 1; fi
      - name: Verify all desktop gameplay, UI, inventory, furniture and animation tests
        run: python3 tools/test.py /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Install desktop export templates
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -j -q /tmp/templates.tpz 'templates/windows_release_x86_64.exe' 'templates/windows_release_x86_64_console.exe' 'templates/linux_release.x86_64' 'templates/version.txt' -d ~/.local/share/godot/export_templates/4.7.2.stable
      - name: Build Windows and Linux test candidates
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --export-release 'Windows Desktop' 2>&1 | tee /tmp/afb-windows-export.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --export-release 'Linux' 2>&1 | tee /tmp/afb-linux-export.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/afb-windows-export.log /tmp/afb-linux-export.log; then exit 1; fi
          test -s build/windows/AFewBuds-3D-Prototype.exe
          test -s build/linux/AFewBuds-3D-Prototype.x86_64
          printf 'AFewBuds Desktop House Grow Room QA\nSource commit: %s\nPublic releases unchanged\n' "${GITHUB_SHA}" > build/windows/BUILD_VERSION.txt
          cp build/windows/BUILD_VERSION.txt build/linux/BUILD_VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AFewBuds-Desktop-House-Grow-Windows-${{ github.run_number }}
          path: build/windows/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: AFewBuds-Desktop-House-Grow-Linux-${{ github.run_number }}
          path: build/linux/
          if-no-files-found: error
          retention-days: 14
