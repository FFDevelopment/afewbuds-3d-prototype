name: Validate property phone hub - desktop
on:
  push:
    branches: [feature/property-phone-hub-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staff-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Restore assets
        run: python3 tools/recover_assets.py /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import game
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/import.log; then exit 1;fi
      - name: Test staff menu, transfers, firing and regression suite
        run: python3 tools/test.py /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
